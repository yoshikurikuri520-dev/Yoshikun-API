services:
  - type: web
    name: yoshikungpt-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "20"

      - key: OPENAI_MODEL
        value: gpt-5-nano

      - key: OPENAI_API_KEY
        sync: false

      - key: ALLOWED_ORIGINS
        value: https://yoshikurikuri520-dev.github.io
